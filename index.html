<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/easy-visit-china-site/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <script>
      ;(function (location) {
        if (!location.search.startsWith('?/')) {
          return
        }

        const decoded = location.search
          .slice(1)
          .split('&')
          .map((segment, index) => index === 0 ? segment : `?${segment}`)
          .join('')
          .replace(/~and~/g, '&')

        window.history.replaceState(
          null,
          '',
          `${location.pathname.slice(0, -1)}${decoded}${location.hash}`,
        )
      })(window.location)
    </script>
    <script type="module" crossorigin src="/easy-visit-china-site/assets/main-C_TuDNUe.js"></script>
    <link rel="stylesheet" crossorigin href="/easy-visit-china-site/assets/main-CNbMrCO2.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
