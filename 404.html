<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
      ;(function () {
        const { location } = window
        const basePath = '/easy-visit-china-site/' === '/' ? '' : '/easy-visit-china-site/'.replace(/\/$/, '')
        const routePath = location.pathname.startsWith(basePath)
          ? location.pathname.slice(basePath.length)
          : location.pathname
        const normalizedRoutePath = routePath.replace(/^\//, '').replace(/&/g, '~and~')
        const normalizedSearch = location.search
          ? `&${location.search.slice(1).replace(/&/g, '~and~')}`
          : ''

        location.replace(
          `${location.origin}${basePath}/?/${normalizedRoutePath}${normalizedSearch}${location.hash}`,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
